name: Apply close-edge report fix

on:
  push:
    branches: [ audit/close-edge-report-projection ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[close-edge-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/close-edge-report-projection
          fetch-depth: 0

      - name: Apply reviewed engine patch
        shell: bash
        run: |
          cat > /tmp/close-edge.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/close-edge.patch.gz.b64 | gzip -d > /tmp/close-edge.patch
          git apply --check /tmp/close-edge.patch
          git apply /tmp/close-edge.patch

      - name: Run focused tests
        run: dotnet test tests/AR.Iec61850.Tests/AR.Iec61850.Tests.csproj --configuration Release --filter "FullyQualifiedName~MmsReportControlFieldCodecTests|FullyQualifiedName~MmsReportValueProjectorTests"

      - name: Commit corrected report pipeline
        shell: bash
        run: |
          git rm .github/workflows/apply-close-edge-report-fix.yml
          git rm .github/workflows/export-report-source.yml
          git rm docs/close-edge-report-audit.md docs/close-edge-report-audit-status.md docs/close-edge-report-fix-ready.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AR.Iec61850/Binding/Iec61850ValueBindingEngine.cs \
                  src/AR.Iec61850/Mms/MmsPersistentReportMonitor.cs \
                  src/AR.Iec61850/Mms/MmsReportControlFieldCodec.cs \
                  src/AR.Iec61850/Mms/MmsReportSubscriptionPlan.cs \
                  tests/AR.Iec61850.Tests/Mms/MmsReportControlFieldCodecTests.cs \
                  tests/AR.Iec61850.Tests/Mms/MmsReportValueProjectorTests.cs
          git commit -m 'fix(reporting): enforce dchg and decode DBPOS close events [close-edge-applied]'
          git push origin HEAD:audit/close-edge-report-projection
