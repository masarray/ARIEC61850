name: Temporary apply live RCB DataSet export fix

on:
  push:
    branches: [ fix/live-rcb-dataset-export ]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-rcb-dataset-export
          fetch-depth: 0

      - name: Apply engine fix and regression tests
        shell: python
        run: |
          from pathlib import Path

          availability_path = Path('src/AR.Iec61850/Mms/MmsRcbAvailability.cs')
          text = availability_path.read_text(encoding='utf-8')
          old = '''    public bool DataSetDirectoryRead { get; init; }
              public bool DataSetDirectorySuccess { get; init; }
              public int DataSetMemberCount { get; init; }
          '''.replace('              ', '    ')
          new = '''    public bool DataSetDirectoryRead { get; init; }
              public bool DataSetDirectorySuccess { get; init; }
              public bool? DataSetIsDeletable { get; init; }
              public int DataSetMemberCount { get; init; }
              public IReadOnlyList<MmsDataSetDirectoryMember> DataSetMembers { get; init; } = Array.Empty<MmsDataSetDirectoryMember>();
          '''.replace('              ', '    ')
          if 'DataSetMembers { get; init; }' not in text:
              if old not in text:
                  raise SystemExit('MmsRcbAvailabilitySnapshot anchor not found')
              text = text.replace(old, new, 1)
          old = '''            DataSetDirectoryRead = directoryRead,
                      DataSetDirectorySuccess = directorySuccess,
                      DataSetMemberCount = memberCount,
          '''.replace('                      ', '            ')
          new = '''            DataSetDirectoryRead = directoryRead,
                      DataSetDirectorySuccess = directorySuccess,
                      DataSetIsDeletable = dataSetDirectory?.IsDeletable,
                      DataSetMemberCount = memberCount,
                      DataSetMembers = dataSetDirectory?.Members.ToArray() ?? Array.Empty<MmsDataSetDirectoryMember>(),
          '''.replace('                      ', '            ')
          if 'DataSetIsDeletable = dataSetDirectory?.IsDeletable' not in text:
              if old not in text:
                  raise SystemExit('availability result initializer anchor not found')
              text = text.replace(old, new, 1)
          availability_path.write_text(text, encoding='utf-8')

          filter_path = Path('src/AR.Iec61850/Scl/Export/SclReportControlFilter.cs')
          text = filter_path.read_text(encoding='utf-8')
          anchor = '''    public static LiveIedModelDiscoveryDocument FilterLiveModel(
                  LiveIedModelDiscoveryDocument source,
                  string selectedReportControlReference)
              {
          '''.replace('              ', '    ')
          implementation = '''    public static LiveIedModelDiscoveryDocument FilterLiveModel(
                  LiveIedModelDiscoveryDocument source,
                  string selectedReportControlReference,
                  MmsRcbAvailabilityResult availability)
              {
                  ArgumentNullException.ThrowIfNull(availability);
                  return FilterLiveModel(
                      MergeLiveDataSetEvidence(source, availability.ReportControls),
                      selectedReportControlReference);
              }

              /// <summary>
              /// Merges the exact DataSet directory returned by the read-only RCB availability
              /// audit into a cloned live discovery document. Some relays expose the DataSet
              /// member count during discovery but only return the actual member references when
              /// GetDataSetDirectory is requested explicitly. The source model is never mutated.
              /// </summary>
              public static LiveIedModelDiscoveryDocument MergeLiveDataSetEvidence(
                  LiveIedModelDiscoveryDocument source,
                  IEnumerable<MmsRcbAvailabilitySnapshot> availabilitySnapshots)
              {
                  ArgumentNullException.ThrowIfNull(source);
                  ArgumentNullException.ThrowIfNull(availabilitySnapshots);

                  var evidenceByReference = availabilitySnapshots
                      .Where(snapshot => snapshot.DataSetDirectorySuccess &&
                                         !string.IsNullOrWhiteSpace(snapshot.DataSetReference) &&
                                         snapshot.DataSetMembers.Count > 0)
                      .GroupBy(snapshot => NormalizeReference(snapshot.DataSetReference), StringComparer.OrdinalIgnoreCase)
                      .ToDictionary(group => group.Key, group => group.First(), StringComparer.OrdinalIgnoreCase);

                  if (evidenceByReference.Count == 0)
                      return source;

                  var mergedDataSets = new List<LiveIedDataSetModel>();
                  var mergedReferences = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
                  foreach (var dataSet in source.DataSets)
                  {
                      var normalized = NormalizeReference(dataSet.Reference);
                      if (!evidenceByReference.TryGetValue(normalized, out var evidence))
                      {
                          mergedDataSets.Add(dataSet);
                          mergedReferences.Add(normalized);
                          continue;
                      }

                      mergedDataSets.Add(MergeDataSet(dataSet, evidence));
                      mergedReferences.Add(normalized);
                  }

                  foreach (var pair in evidenceByReference)
                  {
                      if (mergedReferences.Contains(pair.Key))
                          continue;
                      mergedDataSets.Add(CreateDataSetFromEvidence(source, pair.Value));
                  }

                  var coverage = source.Coverage;
                  var mergedCoverage = new LiveIedModelDiscoveryCoverage
                  {
                      LogicalDeviceCount = coverage.LogicalDeviceCount,
                      LogicalNodeCount = coverage.LogicalNodeCount,
                      DataObjectCount = coverage.DataObjectCount,
                      DataAttributeCount = coverage.DataAttributeCount,
                      ExactFunctionalConstraintCount = coverage.ExactFunctionalConstraintCount,
                      HighConfidenceCdcCount = coverage.HighConfidenceCdcCount,
                      MediumConfidenceCdcCount = coverage.MediumConfidenceCdcCount,
                      LowConfidenceCdcCount = coverage.LowConfidenceCdcCount,
                      UnknownCdcCount = coverage.UnknownCdcCount,
                      DataSetCount = mergedDataSets.Count,
                      FileCount = coverage.FileCount,
                      VariableTypeReadAttemptCount = coverage.VariableTypeReadAttemptCount,
                      VariableTypeReadSuccessCount = coverage.VariableTypeReadSuccessCount,
                      VariableTypeReadFailureCount = coverage.VariableTypeReadFailureCount,
                      ExactMmsTypeCount = coverage.ExactMmsTypeCount,
                      ReportControlCount = coverage.ReportControlCount,
                      BufferedReportControlCount = coverage.BufferedReportControlCount,
                      UnbufferedReportControlCount = coverage.UnbufferedReportControlCount,
                      GooseControlBlockCount = coverage.GooseControlBlockCount,
                      SampledValueControlBlockCount = coverage.SampledValueControlBlockCount,
                      SettingGroupControlCount = coverage.SettingGroupControlCount,
                      LogControlCount = coverage.LogControlCount
                  };

                  return new LiveIedModelDiscoveryDocument
                  {
                      SchemaVersion = source.SchemaVersion,
                      GeneratedAtUtc = source.GeneratedAtUtc,
                      Source = source.Source,
                      Host = source.Host,
                      Port = source.Port,
                      IedName = source.IedName,
                      IedIdentity = source.IedIdentity,
                      AccessPointName = source.AccessPointName,
                      Summary = $"{source.Summary} Live DataSet directory evidence merged for selected-RCB export.",
                      Coverage = mergedCoverage,
                      LogicalDevices = source.LogicalDevices,
                      FileDirectory = source.FileDirectory,
                      DataSets = mergedDataSets.OrderBy(item => item.Reference, StringComparer.OrdinalIgnoreCase).ToArray(),
                      ReportControls = source.ReportControls,
                      GooseControlBlocks = source.GooseControlBlocks,
                      SampledValueControlBlocks = source.SampledValueControlBlocks,
                      SettingGroupControls = source.SettingGroupControls,
                      LogControls = source.LogControls,
                      TypeTemplates = source.TypeTemplates,
                      VariableTypeDiscoveries = source.VariableTypeDiscoveries,
                      Warnings = source.Warnings
                  };
              }

              private static LiveIedDataSetModel MergeDataSet(
                  LiveIedDataSetModel source,
                  MmsRcbAvailabilitySnapshot evidence)
              {
                  var members = ConvertDataSetMembers(evidence);
                  return new LiveIedDataSetModel
                  {
                      Reference = source.Reference,
                      Domain = source.Domain,
                      LogicalNode = source.LogicalNode,
                      Name = source.Name,
                      IsDeletable = evidence.DataSetIsDeletable ?? source.IsDeletable,
                      MemberCount = members.Count,
                      Members = members,
                      UsedByReportControls = source.UsedByReportControls,
                      UsedByGooseControls = source.UsedByGooseControls,
                      UsedBySampledValueControls = source.UsedBySampledValueControls
                  };
              }

              private static LiveIedDataSetModel CreateDataSetFromEvidence(
                  LiveIedModelDiscoveryDocument source,
                  MmsRcbAvailabilitySnapshot evidence)
              {
                  var (domain, logicalNode, name) = ParseDataSetReference(evidence.DataSetReference);
                  var usedByReports = source.ReportControls
                      .Where(control => NormalizeReference(control.DataSetReference)
                          .Equals(NormalizeReference(evidence.DataSetReference), StringComparison.OrdinalIgnoreCase))
                      .Select(control => control.Reference)
                      .Distinct(StringComparer.OrdinalIgnoreCase)
                      .ToArray();
                  var members = ConvertDataSetMembers(evidence);
                  return new LiveIedDataSetModel
                  {
                      Reference = evidence.DataSetReference,
                      Domain = domain,
                      LogicalNode = logicalNode,
                      Name = name,
                      IsDeletable = evidence.DataSetIsDeletable,
                      MemberCount = members.Count,
                      Members = members,
                      UsedByReportControls = usedByReports
                  };
              }

              private static IReadOnlyList<LiveIedDataSetMemberModel> ConvertDataSetMembers(
                  MmsRcbAvailabilitySnapshot evidence)
                  => evidence.DataSetMembers
                      .Select((member, index) => new LiveIedDataSetMemberModel
                      {
                          Index = index,
                          Reference = FirstNonEmpty(member.UserReference, member.MmsReference),
                          FunctionalConstraint = member.FunctionalConstraint,
                          MmsReference = member.MmsReference,
                          Confidence = member.Confidence >= 90
                              ? LiveIedDiscoveryConfidenceLevel.Exact
                              : LiveIedDiscoveryConfidenceLevel.High
                      })
                      .Where(member => !string.IsNullOrWhiteSpace(member.Reference))
                      .GroupBy(member => $"{NormalizeReference(member.Reference)}|{member.FunctionalConstraint}", StringComparer.OrdinalIgnoreCase)
                      .Select(group => group.First())
                      .Select((member, index) => new LiveIedDataSetMemberModel
                      {
                          Index = index,
                          Reference = member.Reference,
                          FunctionalConstraint = member.FunctionalConstraint,
                          MmsReference = member.MmsReference,
                          Confidence = member.Confidence
                      })
                      .ToArray();

              private static (string Domain, string LogicalNode, string Name) ParseDataSetReference(string reference)
              {
                  var normalized = NormalizeReference(reference);
                  var slash = normalized.IndexOf('/');
                  var dot = normalized.LastIndexOf('.');
                  if (slash <= 0 || dot <= slash || dot >= normalized.Length - 1)
                      throw new InvalidOperationException($"DataSet reference '{reference}' cannot be mapped into the live SCL model.");
                  return (normalized[..slash], normalized[(slash + 1)..dot], normalized[(dot + 1)..]);
              }

              private static string FirstNonEmpty(params string?[] values)
                  => values.FirstOrDefault(value => !string.IsNullOrWhiteSpace(value))?.Trim() ?? string.Empty;

          '''.replace('              ', '    ')
          if 'MergeLiveDataSetEvidence(' not in text:
              if anchor not in text:
                  raise SystemExit('FilterLiveModel anchor not found')
              text = text.replace(anchor, implementation + anchor, 1)
          filter_path.write_text(text, encoding='utf-8')

          availability_tests = Path('tests/AR.Iec61850.Tests/Mms/MmsRcbAvailabilityTests.cs')
          text = availability_tests.read_text(encoding='utf-8')
          old = '''        Assert.True(result.IsSelectable);
                  Assert.Equal(2, result.DataSetMemberCount);
          '''.replace('                  ', '        ')
          new = '''        Assert.True(result.IsSelectable);
                  Assert.Equal(2, result.DataSetMemberCount);
                  Assert.Equal(2, result.DataSetMembers.Count);
                  Assert.Equal("IED1LD0/XCBR1.Pos.stVal", result.DataSetMembers[0].UserReference);
          '''.replace('                  ', '        ')
          if 'Assert.Equal(2, result.DataSetMembers.Count);' not in text:
              if old not in text:
                  raise SystemExit('availability test anchor not found')
              text = text.replace(old, new, 1)
          availability_tests.write_text(text, encoding='utf-8')

          filter_tests = Path('tests/AR.Iec61850.Tests/Scl/SclReportControlFilterTests.cs')
          text = filter_tests.read_text(encoding='utf-8')
          if 'using AR.Iec61850.Mms;' not in text:
              text = text.replace('using AR.Iec61850.Discovery;\n', 'using AR.Iec61850.Discovery;\nusing AR.Iec61850.Mms;\n', 1)
          test = '''
              [Fact]
              public void FilterLiveModel_Merges_ReadOnly_DataSet_Directory_Evidence_Before_Export()
              {
                  var dataSet = new LiveIedDataSetModel
                  {
                      Reference = "IED1LD0/LLN0.DataSet",
                      Domain = "IED1LD0",
                      LogicalNode = "LLN0",
                      Name = "DataSet",
                      MemberCount = 1,
                      Members = Array.Empty<LiveIedDataSetMemberModel>()
                  };
                  var selected = new LiveIedReportControlModel
                  {
                      Reference = "IED1LD0/LLN0.RP.URCB01",
                      Domain = "IED1LD0",
                      LogicalNode = "LLN0",
                      Name = "URCB01",
                      Buffered = false,
                      DataSetReference = dataSet.Reference
                  };
                  var source = new LiveIedModelDiscoveryDocument
                  {
                      IedName = "IED1",
                      DataSets = new[] { dataSet },
                      ReportControls = new[] { selected },
                      Coverage = new LiveIedModelDiscoveryCoverage
                      {
                          ReportControlCount = 1,
                          UnbufferedReportControlCount = 1,
                          DataSetCount = 1
                      }
                  };
                  var availability = new MmsRcbAvailabilityResult
                  {
                      ReportControls = new[]
                      {
                          new MmsRcbAvailabilitySnapshot
                          {
                              Reference = selected.Reference,
                              DataSetReference = dataSet.Reference,
                              DataSetDirectoryRead = true,
                              DataSetDirectorySuccess = true,
                              DataSetMemberCount = 1,
                              DataSetMembers = new[]
                              {
                                  new MmsDataSetDirectoryMember
                                  {
                                      Domain = "IED1LD0",
                                      MmsItemName = "XCBR1$ST$Pos$stVal",
                                      UserReference = "IED1LD0/XCBR1.Pos.stVal",
                                      FunctionalConstraint = "ST"
                                  }
                              }
                          }
                      }
                  };

                  var filtered = SclReportControlFilter.FilterLiveModel(source, selected.Reference, availability);

                  var mergedDataSet = Assert.Single(filtered.DataSets);
                  var member = Assert.Single(mergedDataSet.Members);
                  Assert.Equal("IED1LD0/XCBR1.Pos.stVal", member.Reference);
                  Assert.Equal("ST", member.FunctionalConstraint);
                  Assert.Empty(source.DataSets[0].Members);
                  Assert.Single(filtered.ReportControls);
              }

          '''.replace('              ', '    ')
          if 'FilterLiveModel_Merges_ReadOnly_DataSet_Directory_Evidence_Before_Export' not in text:
              marker = '    private static string Fixture()\n'
              if marker not in text:
                  raise SystemExit('filter test anchor not found')
              text = text.replace(marker, test + marker, 1)
          filter_tests.write_text(text, encoding='utf-8')

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and test
        run: |
          dotnet restore ARIEC61850.sln
          dotnet test ARIEC61850.sln -c Release --no-restore

      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- src tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Preserve live DataSet members for selected-RCB export"
          git push origin HEAD:fix/live-rcb-dataset-export
