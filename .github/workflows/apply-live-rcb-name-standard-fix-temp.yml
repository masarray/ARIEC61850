name: Apply live RCB naming correction

on:
  push:
    branches:
      - fix/live-rcb-exact-name

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-rcb-exact-name
      - name: Apply exact non-indexed live RCB mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/AR.Iec61850/Scl/Export/LiveIedSclExporter.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            new XAttribute("buffered", rcb.Buffered ? "true" : "false"),
            new XAttribute("bufTime", ParseUIntText(rcb.BufferTimeMs, 0U)),'''
          new = '''            new XAttribute("buffered", rcb.Buffered ? "true" : "false"),
            // Live MMS discovery exposes the concrete RCB instance name. SCL defaults
            // ReportControl@indexed to true, which would append another two-digit
            // suffix during import (A_BRCB_1201 -> A_BRCB_120101). Export the known
            // concrete instance as one explicitly non-indexed ReportControl instead.
            new XAttribute("indexed", "false"),
            new XAttribute("bufTime", ParseUIntText(rcb.BufferTimeMs, 0U)),'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one BuildReportControl insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AR.Iec61850/Scl/Export/LiveIedSclExporter.cs
          git commit -m "Export live RCB instances without duplicate index suffix"
          git push origin HEAD:fix/live-rcb-exact-name