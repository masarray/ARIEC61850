name: Apply P1 SCL DataSet binding fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/scl-dataset-binding-resolution' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          ref: fix/scl-dataset-binding-resolution
          fetch-depth: 0

      - name: Apply reviewed source changes
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          changed = False

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              global changed
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count == 0:
                  if replacement.strip() in text:
                      return
                  raise SystemExit(f"Scoped source block was not found in {path}: {pattern}")
              file.write_text(updated, encoding="utf-8")
              changed = True

          models = Path("src/AR.Iec61850/Scl/SclModels.cs")
          model_text = models.read_text(encoding="utf-8")
          if "enum SclDataSetBindingStatus" not in model_text:
              model_text = model_text.replace(
                  "public sealed class SclReportControl",
                  """public enum SclDataSetBindingStatus
          {
              NotSpecified,
              Unresolved,
              ResolvedEmpty,
              Resolved
          }

          public sealed class SclReportControl""",
                  1)
              model_text = model_text.replace(
                  "    public string DataSetReference { get; init; } = string.Empty;\n    public string ControlBlockReference",
                  "    public string DataSetReference { get; init; } = string.Empty;\n    public SclDataSetBindingStatus DataSetBindingStatus { get; init; }\n    public string ControlBlockReference",
                  1)
              models.write_text(model_text, encoding="utf-8")
              changed = True

          parser_path = "src/AR.Iec61850/Scl/SclParser.cs"
          parser = Path(parser_path).read_text(encoding="utf-8")
          if "var dataSetBinding = SclDataSetReferenceResolver.Resolve(" not in parser:
              sub_once(
                  parser_path,
                  r'''(?P<indent>\s*)var dataSetName = Attr\(control, "datSet"\);\s*var dataSet = ResolveDataSet\(dataSets, iedName, ldInst, lnPath, dataSetName\);\s*if \(dataSet is null && !string\.IsNullOrWhiteSpace\(dataSetName\)\)\s*warnings\.Add\(\$"Report \{iedName\}\{ldInst\}/\{lnPath\}\$\{name\} references missing DataSet '\{dataSetName\}'\."\);\s*var buffered = BoolAttr\(control, "buffered"\);''',
                  '''\g<indent>var dataSetName = Attr(control, "datSet");
          \g<indent>var dataSetBinding = SclDataSetReferenceResolver.Resolve(
          \g<indent>    dataSets.Values,
          \g<indent>    iedName,
          \g<indent>    ldInst,
          \g<indent>    lnPath,
          \g<indent>    dataSetName);
          \g<indent>var dataSet = dataSetBinding.DataSet;

          \g<indent>var buffered = BoolAttr(control, "buffered");''')
              sub_once(
                  parser_path,
                  r'''DataSetName = dataSetName,\s*DataSetReference = dataSet\?\.Reference \?\? BuildDataSetReference\(iedName, ldInst, lnPath, dataSetName\),\s*ControlBlockReference =''',
                  '''DataSetName = dataSetName,
                              DataSetReference = dataSetBinding.CanonicalReference,
                              DataSetBindingStatus = dataSetBinding.Status,
                              ControlBlockReference =''')

          engineering_path = "src/AR.Iec61850/Scl/Engineering/SclEngineeringProfileBuilder.cs"
          engineering = Path(engineering_path).read_text(encoding="utf-8")
          if "SCL_REPORT_DATASET_UNRESOLVED" not in engineering:
              sub_once(
                  engineering_path,
                  r'''        foreach \(var report in document\.ReportControls\)\s*\{\s*if \(string\.IsNullOrWhiteSpace\(report\.DataSetName\)\)\s*findings\.Add\(Finding\("High", "SCL_REPORT_DATASET_MISSING", \$"Report \{report\.ControlBlockReference\} has no datSet attribute\.", report\.ControlBlockReference\)\);\s*if \(report\.Entries\.Count == 0\)\s*findings\.Add\(Finding\("High", "SCL_REPORT_DATASET_EMPTY", \$"Report \{report\.ControlBlockReference\} has no resolved DataSet members\.", report\.ControlBlockReference\)\);\s*if \(report\.ConfigurationRevision == 0\)\s*findings\.Add\(Finding\("Warning", "SCL_REPORT_CONFREV_ZERO", \$"Report \{report\.ControlBlockReference\} has confRev=0\.", report\.ControlBlockReference\)\);\s*\}''',
                  '''        foreach (var report in document.ReportControls)
          {
              switch (report.DataSetBindingStatus)
              {
                  case SclDataSetBindingStatus.NotSpecified when report.Indexed:
                      findings.Add(Finding(
                          "Warning",
                          "SCL_REPORT_DATASET_UNASSIGNED",
                          $"Indexed report {report.ControlBlockReference} has no datSet assignment. The RCB may be preallocated and must be bound before use.",
                          report.ControlBlockReference));
                      break;
                  case SclDataSetBindingStatus.NotSpecified:
                      findings.Add(Finding(
                          "High",
                          "SCL_REPORT_DATASET_MISSING",
                          $"Report {report.ControlBlockReference} has no datSet attribute.",
                          report.ControlBlockReference));
                      break;
                  case SclDataSetBindingStatus.Unresolved:
                      findings.Add(Finding(
                          "Warning",
                          "SCL_REPORT_DATASET_UNRESOLVED",
                          $"Report {report.ControlBlockReference} references DataSet '{report.DataSetName}', but no unique matching DataSet was resolved in the same IED, logical device, and logical node scope.",
                          report.ControlBlockReference));
                      break;
                  case SclDataSetBindingStatus.ResolvedEmpty:
                      findings.Add(Finding(
                          "High",
                          "SCL_REPORT_DATASET_EMPTY",
                          $"Report {report.ControlBlockReference} resolves to DataSet {report.DataSetReference}, but that DataSet contains no FCDA members.",
                          report.ControlBlockReference));
                      break;
              }

              if (report.ConfigurationRevision == 0)
                  findings.Add(Finding("Warning", "SCL_REPORT_CONFREV_ZERO", $"Report {report.ControlBlockReference} has confRev=0.", report.ControlBlockReference));
          }''')

          if Path(".p1").exists():
              shutil.rmtree(".p1")
              changed = True
          for marker in Path("docs").glob(".keep-p1-note*"):
              marker.unlink()
              changed = True

          Path("/tmp/p1_changed").write_text("true" if changed else "false", encoding="utf-8")
          PY
          echo "changed=$(cat /tmp/p1_changed)" >> "$GITHUB_OUTPUT"

      - name: Commit typed resolver implementation
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify SCL ReportControl DataSet bindings [applied]"
          git push origin HEAD:fix/scl-dataset-binding-resolution
