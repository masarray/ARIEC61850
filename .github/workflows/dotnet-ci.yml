name: .NET CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "samples/**"
      - "docs/**"
      - "landing/**"
      - "scripts/**"
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "DCO.txt"
      - "*.sln"
      - "*.slnx"
      - "Directory.Build.props"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and public-source verification
    runs-on: windows-latest

    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          $ref = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          git clone --quiet --depth 1 --branch $ref "https://github.com/$env:GITHUB_REPOSITORY.git" source

      - name: Verify source, provenance, wording and license boundaries
        shell: pwsh
        run: ./source/scripts/verify-source-clean.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\source\ARIEC61850.sln

      - name: Build
        run: dotnet build .\source\ARIEC61850.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\source\ARIEC61850.sln -c Release --no-build --verbosity normal
