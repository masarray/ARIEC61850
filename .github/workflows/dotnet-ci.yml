name: .NET CI

# Always attest the immutable triggering source, not the mutable PR branch tip.
env:
  ARIEC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "samples/**"
      - "docs/**"
      - "landing/**"
      - "scripts/**"
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "DCO.txt"
      - "*.sln"
      - "*.slnx"
      - "Directory.Build.props"
  pull_request:
    # The live ARSAS product pins PR #169 until targeted engine changes pass CI.
    # Stacked engine PRs must run the exact same Windows build/test gate.
    branches: [ main, feat/495-dataset-type-closure, fix/p10-9l-readonly-ctlmodel-probe, fix/p0-b-target-scoped-rcb-pager-20261019, fix/p0-c-typed-read-trace-20261019 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and public-source verification
    runs-on: windows-latest

    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          $ref = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sourceSha = $env:ARIEC_SOURCE_SHA
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Missing immutable source commit SHA for this workflow."
          }
          git clone --quiet --depth 1 --branch $ref "https://github.com/$env:GITHUB_REPOSITORY.git" source
          if ($LASTEXITCODE -ne 0) { throw "Engine source checkout failed." }
          git -C source fetch --quiet --depth 1 origin $sourceSha
          if ($LASTEXITCODE -ne 0) { throw "Exact source SHA fetch failed." }
          git -C source checkout --quiet --detach $sourceSha
          if ($LASTEXITCODE -ne 0) { throw "Exact source SHA checkout failed." }
          $verifiedSha = (git -C source rev-parse HEAD).Trim()
          if ($verifiedSha -ne $sourceSha) {
            throw "Source SHA drift: expected $sourceSha, got $verifiedSha."
          }
          Write-Host "Verified exact ARIEC source commit $verifiedSha"

      - name: Verify source, provenance, wording and license boundaries
        shell: pwsh
        run: ./source/scripts/verify-source-clean.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\source\ARIEC61850.sln

      - name: Build
        run: dotnet build .\source\ARIEC61850.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null
          dotnet test .\source\ARIEC61850.sln `
            -c Release `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=ARIEC61850.Tests.trx" `
            --results-directory artifacts/test-results 2>&1 |
            Tee-Object -FilePath artifacts/test-results/dotnet-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package test build
        if: success()
        shell: pwsh
        run: |
          $root = "artifacts/ariec61850-test-build"
          $binary = Join-Path $root "lib/net8.0"
          $nuget = Join-Path $root "nuget"
          $builtBinary = ".\source\.artifacts\bin\AR.Iec61850\Release\net8.0"
          New-Item -ItemType Directory -Path $binary -Force | Out-Null
          New-Item -ItemType Directory -Path $nuget -Force | Out-Null

          if (-not (Test-Path $builtBinary)) {
            throw "Expected Release output was not found at $builtBinary"
          }
          Copy-Item (Join-Path $builtBinary "*") $binary -Recurse -Force

          $packageVersion = "0.0.0-pr134.$env:GITHUB_RUN_NUMBER"
          dotnet pack .\source\src\AR.Iec61850\AR.Iec61850.csproj `
            -c Release `
            --no-build `
            -o $nuget `
            -p:PackageVersion=$packageVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @(
            "ARIEC61850 PR #134 smart-discovery test build",
            "Commit: $env:ARIEC_SOURCE_SHA",
            "Branch: $env:GITHUB_HEAD_REF",
            "Run: $env:GITHUB_RUN_NUMBER",
            "TargetFramework: net8.0",
            "NuGetVersion: $packageVersion",
            "",
            "lib/net8.0 contains the direct Release build for DLL-reference testing.",
            "nuget contains the installable local .nupkg for PackageReference testing."
          ) | Set-Content -Path (Join-Path $root "BUILD.txt") -Encoding utf8

      - name: Upload PR test build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ariec61850-pr134-test-build
          path: artifacts/ariec61850-test-build
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ariec61850-test-diagnostics
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
