name: .NET CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "samples/**"
      - "*.slnx"
      - "Directory.Build.props"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ARIEC61850.slnx

      - name: Build
        run: dotnet build ARIEC61850.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ARIEC61850.slnx -c Release --no-build --verbosity normal
