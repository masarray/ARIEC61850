name: .NET CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "samples/**"
      - "docs/**"
      - "landing/**"
      - "scripts/**"
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "DCO.txt"
      - "*.sln"
      - "*.slnx"
      - "Directory.Build.props"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and public-source verification
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Verify source, provenance, wording and license boundaries
        shell: pwsh
        run: ./scripts/verify-source-clean.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ARIEC61850.sln

      - name: Build
        run: dotnet build ARIEC61850.sln -c Release --no-restore

      - name: Test
        run: dotnet test ARIEC61850.sln -c Release --no-build --verbosity normal
