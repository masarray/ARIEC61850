name: Export report source

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/close-edge-report-projection
      - uses: actions/upload-artifact@v4
        with:
          name: ARIEC61850-report-source
          path: |
            src/AR.Iec61850/Mms
            src/AR.Iec61850/Control
            src/AR.Iec61850/**/*.cs
            tests/**/*.cs
