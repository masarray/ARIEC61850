name: Apply close-edge report correction

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/close-edge-event-reporting
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: |
          git apply --check patches/close-edge-remaining.patch
          git apply patches/close-edge-remaining.patch

      - name: Run focused report tests
        run: dotnet test tests/AR.Iec61850.Tests/AR.Iec61850.Tests.csproj --configuration Release --filter "FullyQualifiedName~MmsReportControlFieldCodecTests|FullyQualifiedName~MmsReportValueProjectorTests"

      - name: Commit corrected report pipeline
        run: |
          git rm .github/workflows/export-report-source.yml
          git rm .github/workflows/apply-close-edge-report-fix.yml
          git rm patches/close-edge-remaining.patch
          git rm docs/close-edge-report-audit.md docs/close-edge-report-audit-status.md docs/close-edge-report-fix-ready.md docs/trigger-close-edge-apply.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AR.Iec61850/Binding/Iec61850ValueBindingEngine.cs \
                  src/AR.Iec61850/Mms/MmsPersistentReportMonitor.cs \
                  src/AR.Iec61850/Mms/MmsReportSubscriptionPlan.cs \
                  tests/AR.Iec61850.Tests/Mms/MmsReportValueProjectorTests.cs
          git commit -m 'fix(reporting): enforce dchg and decode DBPOS close events'
          git push origin HEAD:fix/close-edge-event-reporting
