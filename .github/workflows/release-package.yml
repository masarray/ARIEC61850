name: Build Windows WPF single EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        default: "0.1.0"
      publish_release:
        description: "Create or update GitHub Release"
        type: boolean
        required: true
        default: true
      prerelease:
        description: "Mark GitHub Release as pre-release"
        type: boolean
        required: true
        default: true
      draft:
        description: "Create GitHub Release as draft"
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Publish WPF single-file package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'.Trim()
            if ($version.StartsWith('v')) { $version = $version.Substring(1) }
            $publishRelease = '${{ github.event.inputs.publish_release }}'
            $preRelease = '${{ github.event.inputs.prerelease }}'
            $draft = '${{ github.event.inputs.draft }}'
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $publishRelease = 'true'
            $preRelease = 'true'
            $draft = 'false'
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Release version cannot be empty.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish_release=$publishRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "draft=$draft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify source tree is clean
        shell: pwsh
        run: ./scripts/verify-source-clean.ps1

      - name: Build single-file WPF package
        shell: pwsh
        run: ./scripts/publish-windows-singlefile.ps1 -Version '${{ steps.release.outputs.version }}'

      - name: Verify release package
        shell: pwsh
        run: ./scripts/verify-release-package.ps1 -PackagePath ".artifacts/release/ARIEC61850-SvPublisher-v${{ steps.release.outputs.version }}-win-x64-single-exe.zip" -Version '${{ steps.release.outputs.version }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC61850-SvPublisher-v${{ steps.release.outputs.version }}-win-x64-single-exe
          path: |
            .artifacts/release/AR.Iec61850.SvPublisher-v${{ steps.release.outputs.version }}-win-x64.exe
            .artifacts/release/ARIEC61850-SvPublisher-v${{ steps.release.outputs.version }}-win-x64-single-exe.zip
            .artifacts/release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $exe = ".artifacts/release/AR.Iec61850.SvPublisher-v$version-win-x64.exe"
          $zip = ".artifacts/release/ARIEC61850-SvPublisher-v$version-win-x64-single-exe.zip"
          $sha = ".artifacts/release/SHA256SUMS.txt"
          $target = '${{ github.sha }}'

          $notes = "# ARIEC61850 SV Publisher v$version`n`nWindows x64 self-contained single-file WPF package for IEC 61850 Sampled Values lab publishing.`n`n## Assets`n`n- AR.Iec61850.SvPublisher-v$version-win-x64.exe`n- ARIEC61850-SvPublisher-v$version-win-x64-single-exe.zip`n- SHA256SUMS.txt`n`nNpcap is required on the target Windows machine for live raw Ethernet traffic. Use only on isolated lab networks."
          $notesFile = ".artifacts/release/RELEASE_NOTES_GENERATED.md"
          $notes | Set-Content -Path $notesFile -Encoding UTF8

          $releaseFlags = @()
          if ('${{ steps.release.outputs.prerelease }}' -eq 'true') { $releaseFlags += '--prerelease' }
          if ('${{ steps.release.outputs.draft }}' -eq 'true') { $releaseFlags += '--draft' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe $zip $sha --title "ARIEC61850 SV Publisher $tag" --notes-file $notesFile --target $target @releaseFlags
          } else {
            gh release upload $tag $exe $zip $sha --clobber
          }
