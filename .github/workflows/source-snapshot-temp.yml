name: Temporary source snapshot

on:
  push:
    branches: [ fix/live-rcb-dataset-export ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ariec61850-source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
      # A second user-authored push activates the one-time patch workflow.
