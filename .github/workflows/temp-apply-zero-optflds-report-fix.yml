name: Temporary zero OptFlds report patch

on:
  push:
    branches:
      - fix/zero-optflds-report-mapping

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/zero-optflds-report-mapping
          fetch-depth: 0

      - name: Apply deterministic parser patch
        run: python scripts/patch-zero-optflds-report-mapping.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/AR.Iec61850/Mms/MmsReportLiveSession.cs tests/AR.Iec61850.Tests/Mms/MmsReportExactDecoderTests.cs

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AR.Iec61850/Mms/MmsReportLiveSession.cs tests/AR.Iec61850.Tests/Mms/MmsReportExactDecoderTests.cs
          git commit -m "Fix zero OptFlds report mapping and quarantine raw metadata"
          git push origin HEAD:fix/zero-optflds-report-mapping
