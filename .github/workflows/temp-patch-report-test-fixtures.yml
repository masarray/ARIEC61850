name: Temporary report fixture patch

on:
  push:
    branches:
      - fix/zero-optflds-report-mapping

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-optflds-report-mapping
          fetch-depth: 0
      - run: python scripts/patch-report-test-fixtures.py
      - run: git diff --check
      - name: Commit corrected fixtures
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/AR.Iec61850.Tests/Mms/MmsWriteAndDynamicDataSetTests.cs
          git commit -m "Align report mapper fixtures with IEC OptFlds semantics"
          git push origin HEAD:fix/zero-optflds-report-mapping
